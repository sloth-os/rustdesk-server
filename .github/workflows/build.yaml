name: build

# Builds hbbs/hbbr for the four musl targets and publishes multi-arch
# Docker images (s6 and classic) to GHCR under this repository's owner.
# It authenticates with the built-in GITHUB_TOKEN only — no Docker Hub
# secrets are involved — so it runs unmodified on any fork.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  CARGO_TERM_COLOR: always
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/rustdesk-server-s6
  GHCR_IMAGE_CLASSIC: ghcr.io/${{ github.repository_owner }}/rustdesk-server

jobs:

  # binary build
  build:

    name: Build - ${{ matrix.job.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7",   target: "armv7-unknown-linux-musleabihf" }
          - { name: "i386",    target: "i686-unknown-linux-musl" }

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          cross --version

      # Default features only: --all-features drags in the webrtc crate
      # tree, which the server never calls (the SDP fields in the proto
      # are plain strings).
      - name: Build
        env:
          CROSS_IMAGE: ghcr.io/cross-rs/${{ matrix.job.target }}:0.2.5
        run: cross build --release --target ${{ matrix.job.target }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error

  # docker build and push of single-arch s6 images
  docker:

    name: Docker push - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64",  s6_platform: "x86_64" }
          - { name: "arm64v8", docker_platform: "linux/arm64",  s6_platform: "aarch64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7", s6_platform: "armhf" }
          - { name: "i386",    docker_platform: "linux/386",    s6_platform: "i686" }

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin

      # artifact downloads do not carry the exec bit
      - name: Make binaries executable
        run: chmod -v a+x docker/rootfs/usr/bin/*

      # branch runs publish under :master; tag runs additionally get
      # :major and :latest via the manifest job below
      - name: Compute tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            T="${GITHUB_REF_NAME#v}"
            echo "PRIMARY_TAG=$T" >> "$GITHUB_ENV"
            echo "MANIFEST_TAGS=$T ${T%%.*} latest" >> "$GITHUB_ENV"
          else
            echo "PRIMARY_TAG=master" >> "$GITHUB_ENV"
            echo "MANIFEST_TAGS=master" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.job.s6_platform }}
          tags: ${{ env.GHCR_IMAGE }}:${{ env.PRIMARY_TAG }}-${{ matrix.job.name }}

  # docker build and push of single-arch classic images
  docker-classic:

    name: Docker push (classic) - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64" }
          - { name: "arm64v8", docker_platform: "linux/arm64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7" }
          - { name: "i386",    docker_platform: "linux/386" }

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker-classic

      - name: Make binaries executable
        run: chmod -v a+x docker-classic/*

      - name: Compute tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            T="${GITHUB_REF_NAME#v}"
            echo "PRIMARY_TAG=$T" >> "$GITHUB_ENV"
            echo "MANIFEST_TAGS=$T ${T%%.*} latest" >> "$GITHUB_ENV"
          else
            echo "PRIMARY_TAG=master" >> "$GITHUB_ENV"
            echo "MANIFEST_TAGS=master" >> "$GITHUB_ENV"
          fi

      # the classic image is FROM scratch with COPY only, so no
      # emulation is needed for foreign platforms
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-classic
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          tags: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.PRIMARY_TAG }}-${{ matrix.job.name }}

  # multi-arch manifests for both image families
  docker-manifest:

    name: Docker manifest
    needs:
      - docker
      - docker-classic
    runs-on: ubuntu-22.04

    steps:

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            T="${GITHUB_REF_NAME#v}"
            echo "PRIMARY_TAG=$T" >> "$GITHUB_ENV"
            echo "MANIFEST_TAGS=$T ${T%%.*} latest" >> "$GITHUB_ENV"
          else
            echo "PRIMARY_TAG=master" >> "$GITHUB_ENV"
            echo "MANIFEST_TAGS=master" >> "$GITHUB_ENV"
          fi

      - name: Create multi-arch manifests
        run: |
          set -eux
          for t in $MANIFEST_TAGS; do
            docker buildx imagetools create -t "$GHCR_IMAGE:$t" \
              "$GHCR_IMAGE:$PRIMARY_TAG-amd64" \
              "$GHCR_IMAGE:$PRIMARY_TAG-arm64v8" \
              "$GHCR_IMAGE:$PRIMARY_TAG-armv7" \
              "$GHCR_IMAGE:$PRIMARY_TAG-i386"
            docker buildx imagetools create -t "$GHCR_IMAGE_CLASSIC:$t" \
              "$GHCR_IMAGE_CLASSIC:$PRIMARY_TAG-amd64" \
              "$GHCR_IMAGE_CLASSIC:$PRIMARY_TAG-arm64v8" \
              "$GHCR_IMAGE_CLASSIC:$PRIMARY_TAG-armv7" \
              "$GHCR_IMAGE_CLASSIC:$PRIMARY_TAG-i386"
          done

      - name: Verify manifests
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE:$PRIMARY_TAG"
          docker buildx imagetools inspect "$GHCR_IMAGE_CLASSIC:$PRIMARY_TAG"
